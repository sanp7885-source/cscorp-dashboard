function parseCSV(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}
 row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
function imp(kind){const i=document.createElement('input');i.type='file';i.accept='.csv,.xlsx,.xls';i.onchange=()=>{const fl=i.files[0],r=new FileReader(),xl=/\.xls/i.test(fl.name);
 const run=rows=>{let ok=0,err=[];rows.forEach((x,n)=>{x=x.map(v=>String(v==null?'':v).trim());if(!x.some(Boolean))return;
  if(kind=='cli'){if(!x[1]){err.push(`Row ${n+2}: name missing`);return}if(D.clients.some(c=>c.code==x[0]||c.name.toLowerCase()==x[1].toLowerCase())){err.push(`Row ${n+2}: duplicate ${x[1]}`);return}D.clients.push({id:uid(),code:x[0]||nx('cli','C'),name:x[1],gst:x[2]||'',addr:x[3]||'',person:x[4]||'',mobile:x[5]||'',email:x[6]||''});ok++}
  else{if(!x[0]||!x[2]){err.push(`Row ${n+2}: category/item missing`);return}if(D.inv.some(v=>v.cat==x[0]&&v.sub==x[1]&&v.name.toLowerCase()==x[2].toLowerCase())){err.push(`Row ${n+2}: duplicate ${x[2]}`);return}ensCat(x[0],x[1]);D.inv.push({id:uid(),cat:x[0],sub:x[1]||'',name:x[2],desc:x[3]||'',unit:x[4]||D.units[0],rate:+x[5]||0,gst:+x[6]||0});ok++}});
  save();alert(`Imported ${ok}. Skipped ${err.length}.\n`+err.slice(0,12).join('\n'));go(cur)};
 if(xl){if(typeof XLSX=='undefined')return alert('Excel reader not loaded');r.onload=()=>{const wb=XLSX.read(r.result,{type:'array'});run(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).slice(1))};r.readAsArrayBuffer(fl)}else{r.onload=()=>run(parseCSV(r.result).slice(1));r.readAsText(fl)}};i.click()}

const loadScript=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('Could not load a helper library — check your internet connection'));document.head.appendChild(s)});
async function pdfImgs(f){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];for(let i=1;i<=Math.min(doc.numPages,4);i++){const pg=await doc.getPage(i),vp=pg.getViewport({scale:1.6}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)))}return out}
function parseVendorText(t){const items=[];t.split('\n').forEach(l=>{l=l.trim();if(l.length<6)return;const nums=[...l.matchAll(/(\d[\d,]*\.?\d*)/g)].map(m=>+m[1].replace(/,/g,'')),d=l.replace(/[\d,.]+/g,' ').replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim();if(nums.length>=2&&d.length>2){const a=nums[nums.length-1],r=nums.length>=3?nums[nums.length-2]:a,q=nums.length>=3?nums[nums.length-3]:1;items.push({category:'',description:d,qty:q||1,unit:'',rate:r,gst:0,dimension:''})}});return{vendor:{},items,notes:'Read by OCR — please check every line'}}
async function ocrParse(imgs,st){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');let t='';for(let i=0;i<imgs.length;i++){st('Reading page '+(i+1)+' of '+imgs.length+' (OCR)…');t+=(await Tesseract.recognize(imgs[i],'eng')).data.text+'\n'}return parseVendorText(t)}

 const q={id:uid(),type:mode,no:'',date:today(),client:'',gstno:'',addr:'',person:'',mobile:'',email:'',contractor:mode=='third'?vn:'',contract:'',pid,status:'Draft',ms:mode=='own'?(D.co.msd?JSON.parse(JSON.stringify(D.co.msd)):[{l:'Advance with order confirmation',p:50},{l:'On material delivery at site',p:40},{l:'On handover',p:10}]):[],items,transport:+d.transport||0,install:0,other:0,discount:mode=='third'?(+d.discount||0):0,terms:D.co.terms||'',notes:((d.notes||'')+(d.quote_no?' Vendor quote no. '+d.quote_no:'')).trim(),valid:D.co.valid||15,simple:!items.some(i=>i.cat),nogst:!items.some(i=>i.gst)};
 if(mode=='third'){const c=D.cont.find(x=>x.name==vn)||{};Object.assign(q,{addr:c.addr||(d.vendor&&d.vendor.address)||'',gstno:c.gst||(d.vendor&&d.vendor.gst)||'',mobile:c.mobile||(d.vendor&&d.vendor.phone)||'',person:c.person||''});q.client=pn(pid)}else fillP(q);return q}
function capQ(){modal(`<h2>📷 Create a quotation from a vendor's photo / PDF</h2><p class="sub">Choose the image(s) or PDF your vendor sent. The system reads the lines and makes a draft for you to check — nothing is saved until you press Save.</p><div class="fg"><label>Photo(s) / PDF<input id="cq_f" type="file" accept="image/*,.pdf" multiple></label><label>Project<select id="cq_p"><option value="">— none —</option>${D.proj.map(p=>`<option value="${p.id}" ${p.id==LASTP?'selected':''}>${e(p.name)}</option>`).join('')}</select></label><label>Create as<select id="cq_m" onchange="$('#cq_k').style.display=this.value=='own'?'':'none'"><option value="third">Vendor quotation (third party)</option><option value="own">Client quotation with my markup</option></select></label><label id="cq_k" style="display:none">Markup %<input id="cq_x" type="number" value="15"></label></div><p id="cq_s" class="sub"></p><p><button class="btn am" onclick="capRun()">Read & create draft</button><button class="btn g" onclick="cls()">Cancel</button></p>`)}
